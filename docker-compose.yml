services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - secrets/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:7
    container_name: mongo_db
    env_file:
      - secrets/mongo.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: backend_app
    env_file:
      - secrets/db.env
      - secrets/mongo.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    volumes:
      - ./:/workspace
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mongodb
    command: bash -c "uvicorn main:server_app --host 0.0.0.0 --port 8000 --reload"

  userapp:
    build: .
    container_name: user_app
    environment:
      - BACKEND_URL=http://backend_app:8000
      - BACKEND_HOST=app
      - BACKEND_PORT=8000
    volumes:
      - ./:/workspace
      - ./app:/app
      - ./secrets/users.env:/secrets/users.env
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - secrets/pgadmin.env
    ports:
      - "5050:80"
    depends_on:
      - db

  scraper:
    build: .
    container_name: scraper_app
    env_file:
      - secrets/db.env
      - secrets/mongo.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    volumes:
      - ./:/workspace
      - ./app:/app
    depends_on:
      - db
      - mongodb

volumes:
  pgdata:
  mongo_data:
