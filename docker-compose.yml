services:
  db:
    image: postgres:17
    container_name: postgres_db
    env_file:
      - secrets/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  mongodb:
    image: arm64v8/mongo:4.4.18
    container_name: mongo_db
    platform: linux/arm64
    env_file:
      - secrets/mongo.env
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongo_data:/data/db
      
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend_app
    env_file:
      - secrets/db.env
      - secrets/mongo.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - PYTHONPATH=/workspace
    volumes:
      - ./:/workspace
    working_dir: /workspace/backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - db
      - mongodb
    command: uvicorn main:server_app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: . 
      dockerfile: frontend/Dockerfile
    container_name: frontend_app
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "0.0.0.0:5173:8080"
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - secrets/pgadmin.env
    ports:
      - "0.0.0.0:5050:80"
    depends_on:
      - db

volumes:
  pgdata:
    external: true
    name: 54b48694854fc9c216cc4bb7dd7e253520819687d6928b3ee13b54156ff0e874
  mongo_data:
  frontend_node_modules:
