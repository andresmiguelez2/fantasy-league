services:
  db:
    image: postgres:18
    container_name: postgres_db
    env_file:
      - secrets/db.env
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "0.0.0.0:5432:5432"

  mongodb:
    image: arm64v8/mongo:4.4.18
    container_name: mongo_db
    platform: linux/arm64
    env_file:
      - secrets/mongo.env
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongo_data:/data/db
      
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend_app
    env_file:
      - secrets/db.env
      - secrets/mongo.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    volumes:
      - ./:/workspace
      - ./app:/app
      - ./app:/app
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      - db
      - mongodb
    command: python /app/main.py

  # userapp:
  #   build: .
  #   container_name: user_app
  #   environment:
  #     - BACKEND_URL=http://backend_app:8000
  #     - BACKEND_HOST=app
  #     - BACKEND_PORT=8000
  #   volumes:
  #     - ./:/workspace
  #     - ./app:/app
  #     - ./secrets/users.env:/secrets/users.env
  #   depends_on:
  #     - app

  frontend:
    build:
      context: . 
      dockerfile: Dockerfile.frontend
    container_name: frontend_app
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:5173:8080"
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - secrets/pgadmin.env
    ports:
      - "0.0.0.0:5050:80"
    depends_on:
      - db

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: scraper_app
    env_file:
      - secrets/db.env
      - secrets/mongo.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    volumes:
      - ./app:/app
      - ./:/workspace
      - ./secrets:/workspace/secrets:ro
    depends_on:
      - db
      - mongodb
    ports:
      - "0.0.0.0:33000:22"

volumes:
  pgdata:
  mongo_data:
