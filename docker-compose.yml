services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - secrets/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: backend_app
    env_file:
      - secrets/db.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./:/workspace
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: bash -c "uvicorn main:server_app --host 0.0.0.0 --port 8000 --reload & python /app/main.py"

  userapp:
    build: .
    container_name: user_app
    environment:
      - BACKEND_URL=http://app:8000
      - BACKEND_HOST=app
      - BACKEND_PORT=8000
    volumes:
      - ./:/workspace
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - secrets/pgadmin.env
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
